<!DOCTYPE html>
<html>
<head>
  <title>Islamabad: Between Dreams</title>
  <style>
    body { margin:0; overflow:hidden; font-family:Arial; }
    #ui {
      position:fixed;
      top:10px;
      left:10px;
      color:white;
      background:rgba(0,0,0,0.6);
      padding:10px;
    }
    #storyBox {
      position:fixed;
      bottom:20px;
      left:50%;
      transform:translateX(-50%);
      width:60%;
      background:rgba(0,0,0,0.85);
      color:white;
      padding:20px;
      display:none;
    }
  </style>
</head>
<body>

<div id="ui">
  <div>Mission: <span id="mission">Go to University</span></div>
</div>

<div id="storyBox">
  <div id="storyText"></div>
  <button onclick="closeStory()">Continue</button>
</div>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mp3">
</audio>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000011);

// Fog for cinematic night
scene.fog = new THREE.Fog(0x000011, 10, 100);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,2,5);

const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Ground Road
const road = new THREE.Mesh(
  new THREE.PlaneGeometry(100,10),
  new THREE.MeshStandardMaterial({color:0x222222})
);
road.rotation.x = -Math.PI/2;
scene.add(road);

// Margalla Hills (Mountains)
const hillGeometry = new THREE.ConeGeometry(10,20,4);
const hillMaterial = new THREE.MeshStandardMaterial({color:0x0a3d0a});
for(let i=-2;i<=2;i++){
  const hill = new THREE.Mesh(hillGeometry, hillMaterial);
  hill.position.set(i*20,10,-50);
  scene.add(hill);
}

// Street Lights
for(let i=-40;i<=40;i+=20){
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.2,0.2,5),
    new THREE.MeshStandardMaterial({color:0x888888})
  );
  pole.position.set(i,2.5,0);
  scene.add(pole);

  const light = new THREE.PointLight(0xffddaa,1,15);
  light.position.set(i,5,0);
  scene.add(light);
}

// Buildings
function createBuilding(x,z,color){
  const building = new THREE.Mesh(
    new THREE.BoxGeometry(6,6,6),
    new THREE.MeshStandardMaterial({color:color})
  );
  building.position.set(x,3,z);
  scene.add(building);
  return building;
}

const university = createBuilding(30,-20,0x3344ff);
const office = createBuilding(-30,-20,0xff3333);
const football = createBuilding(0,-40,0x00aa00);

// Lighting
const ambient = new THREE.AmbientLight(0x404040);
scene.add(ambient);

// Rain
const rainGeometry = new THREE.BufferGeometry();
const rainCount = 5000;
const positions = [];

for(let i=0;i<rainCount;i++){
  positions.push(
    Math.random()*200-100,
    Math.random()*100,
    Math.random()*200-100
  );
}

rainGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
const rainMaterial = new THREE.PointsMaterial({color:0xaaaaaa, size:0.1});
const rain = new THREE.Points(rainGeometry,rainMaterial);
scene.add(rain);

// Movement
let moveF=false, moveB=false, moveL=false, moveR=false;
const speed=0.3;

document.addEventListener('keydown',e=>{
  if(e.key==='w') moveF=true;
  if(e.key==='s') moveB=true;
  if(e.key==='a') moveL=true;
  if(e.key==='d') moveR=true;
});
document.addEventListener('keyup',e=>{
  if(e.key==='w') moveF=false;
  if(e.key==='s') moveB=false;
  if(e.key==='a') moveL=false;
  if(e.key==='d') moveR=false;
});

// Missions
let currentMission = 0;
const missions = [
  {target: university, text:"University: Yahan meri asli struggle shuru hui."},
  {target: office, text:"Office: Responsibility ne mujhe change kiya."},
  {target: football, text:"Football Ground: Yahan main apna dard bhool jata hoon."}
];

function checkMission(){
  const target = missions[currentMission];
  if(camera.position.distanceTo(target.target.position)<8){
    showStory(target.text);
    currentMission++;
    if(currentMission < missions.length){
      document.getElementById("mission").innerText =
        currentMission===1 ? "Go to Office" : "Go to Football Ground";
    } else {
      document.getElementById("mission").innerText = "You Completed Your Journey";
    }
  }
}

function showStory(text){
  document.getElementById("storyText").innerText = text;
  document.getElementById("storyBox").style.display="block";
}

function closeStory(){
  document.getElementById("storyBox").style.display="none";
}

document.body.addEventListener("click",()=>{
  document.getElementById("bgMusic").play().catch(()=>{});
});

function animate(){
  requestAnimationFrame(animate);

  if(moveF) camera.position.z -= speed;
  if(moveB) camera.position.z += speed;
  if(moveL) camera.position.x -= speed;
  if(moveR) camera.position.x += speed;

  // Rain falling
  const pos = rain.geometry.attributes.position.array;
  for(let i=1;i<pos.length;i+=3){
    pos[i]-=0.5;
    if(pos[i]<0) pos[i]=100;
  }
  rain.geometry.attributes.position.needsUpdate=true;

  checkMission();
  renderer.render(scene,camera);
}

animate();
</script>
</body>
</html>
